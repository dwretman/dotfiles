# foot config styled like alacritty with the One Dark theme
# (see ~/.config/sway/SETUP.md).
# Docs: man 5 foot.ini. Default values: /etc/xdg/foot/foot.ini

[main]
# Nerd Font, needed for starship's prompt icons
font=JetBrainsMono Nerd Font:size=11
pad=0x0

[cursor]
style=block
blink=no

[colors]
# One Dark, from alacritty-theme (themes/one_dark.toml)
foreground=abb2bf
background=282c34

regular0=1e2127
regular1=e06c75
regular2=98c379
regular3=d19a66
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=abb2bf

bright0=5c6370
bright1=e06c75
bright2=98c379
bright3=d19a66
bright4=61afef
bright5=c678dd
bright6=56b6c2
bright7=ffffff
